version: "2"
run:
  go: "1.21"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - dupl
    - durationcheck
    - exhaustive
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocyclo
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - lll
    - makezero
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - promlinter
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
    - whitespace
  disable:
    - cyclop
    - errname
    - errorlint
    - forbidigo
    - gocritic
    - godot
    - ineffassign
    - nestif
    - unparam
    - wastedassign
  settings:
    # v1 disabled `gosimple` and `stylecheck`; v2 folded both into `staticcheck`,
    # so their check groups are excluded here to keep the SAME rule set the repo
    # has always run. QF* (quickfix) is excluded for the same reason.
    staticcheck:
      checks:
        - all
        - -ST*
        - -QF*
    cyclop:
      max-complexity: 15
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    funlen:
      lines: 100
      statements: 50
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
        - hugeParam
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    lll:
      line-length: 120
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        path: cuserr\.constants\.errors\.go
      - linters:
          - cyclop
          - dupl
          - errcheck
          - funlen
          - gocognit
          - gocyclo
          - goconst
          - gosec
          - noctx
          - testpackage
        path: _test\.go
      - linters:
          - errcheck
          - forbidigo
          - gosec
          - unused
        path: examples/
      - path: (.+)\.go$
        text: Error return value of `.*\.With.*` is not checked
      - path: (.+)\.go$
        text: Error return value of `.*\.Add.*` is not checked
      - path: (.+)\.go$
        text: Error return value of `.*\.Clear.*` is not checked
      - path: (.+)\.go$
        text: Error return value of `.*\.Filter.*` is not checked
      - path: (.+)\.go$
        text: Error return value of `collection\..*` is not checked
      - path: (.+)\.go$
        text: Error return value of `.*\.Error\(\)` is not checked
      - path: (.+)\.go$
        text: should not use basic type.*as key in context.WithValue
      - path: (.+)\.go$
        text: parameter.*seems to be unused.*consider removing
      - path: (.+)\.go$
        text: globalStructuredLogger is a global variable
      - path: (.+)\.go$
        text: globalStructuredLoggerMu is a global variable
      - path: (.+)\.go$
        text: globalConfig is a global variable
      - path: (.+)\.go$
        text: globalConfigMu is a global variable
      - path: (.+)\.go$
        text: should have a package comment
      - path: (.+)\.go$
        text: comment on exported.*should be of the form
      - path: (.+)\.go$
        text: found a struct that contains a context.Context field
      - path: (.+)\.go$
        text: don't use ALL_CAPS in Go names
      - path: (.+)\.go$
        text: has .* occurrences, make it a constant
      - path: (.+)\.go$
        text: redefinition of the built-in function
      - path: (.+)\.go$
        text: calculated cyclomatic complexity for function
      - path: (.+)\.go$
        text: error type name.*should conform to.*Error.*format
      - path: (.+)\.go$
        text: should not use built-in type string as key for value
      - path: (.+)\.go$
        text: type assertion on error will fail on wrapped errors
      - path: (.+)\.go$
        text: comparing with.*will fail on wrapped errors
      - path: (.+)\.go$
        text: non-wrapping format verb for fmt.Errorf
      - path: (.+)\.go$
        text: use of.*fmt\.Print.*forbidden
      - path: (.+)\.go$
        text: shadowing of predeclared identifier
      - path: (.+)\.go$
        text: missing cases in switch of type
      - path: (.+)\.go$
        text: should omit type.*from declaration
      - path: (.+)\.go$
        text: Comment should end in a period
      - path: (.+)\.go$
        text: can be replaced by.*t\.Setenv
      - path: (.+)\.go$
        text: assigned to.*but never used afterwards
      - path: (.+)\.go$
        text: is unused
    paths:
      - third_party$
      - builtin$
      - examples$
severity:
  default: error
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
